# Dependabot version updates (weekly). Security alerts are a separate switch in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions # keeps the SHA pins in .github/workflows up to date
    directory: /
    schedule:
      interval: weekly
