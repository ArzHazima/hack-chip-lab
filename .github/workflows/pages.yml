name: Deploy to GitHub Pages

# Publishes the app as a website on every push to main (and on demand). The tests run first: a red
# test means nothing is deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, write the Pages site, and get an OIDC token (deploy-pages needs it
# to prove this run may publish).
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer one waits for the running one instead of cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same pinned actions as ci.yml (full commit SHA, tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      # The site lives under /<repo name>/, taken from the repository so a rename cannot break it.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
