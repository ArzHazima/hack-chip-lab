name: CI

# Runs on every push and on pull requests. `pull_request` (NOT `pull_request_target`) means a pull
# request from a fork runs with a read-only token and no access to repository secrets.
on:
  push:
  pull_request:

# Least privilege: the workflow can only read the repository. Nothing here needs to write.
permissions:
  contents: read

# A newer push to the same branch / PR cancels the older run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved; a SHA cannot). The tag is kept in
      # the comment. Dependabot (.github/dependabot.yml) proposes updates to these pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # do not leave the GITHUB_TOKEN in .git/config for later steps

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm

      # Installs exactly what package-lock.json says (fails if it is out of date). --ignore-scripts:
      # no dependency may run an install script on the CI machine; this project does not need any.
      - run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc -b

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
