name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Installs exactly what package-lock.json says (fails if it is out of date).
      - run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
